<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#176b72" />
    <meta
      name="description"
      content="ダジャーレせんちょうと こくごの ぐんとうのBGM・効果音を確認する試聴ページ"
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title>おとの しちょうしつ | ダジャーレせんちょう</title>
  </head>
  <body>
    <main id="audio-preview" data-ready="false" data-playing="none">
      <header class="preview-hero">
        <p class="preview-kicker">ダジャーレせんちょうと こくごの ぐんとう</p>
        <h1>おとの しちょうしつ</h1>
        <p class="preview-lead">
          ボタンを おして、ゲームで つかう おとを<br />ひとつずつ かくにんできます。
        </p>

        <div class="preview-controls" aria-label="しちょうの せってい">
          <label class="volume-control" for="preview-volume">
            <span>しちょう おんりょう</span>
            <input id="preview-volume" type="range" min="0" max="200" step="10" value="100" />
            <output id="preview-volume-value" for="preview-volume">100%（ゲームと おなじ）</output>
          </label>
          <label class="loop-control" for="preview-loop">
            <input id="preview-loop" type="checkbox" checked />
            <span>BGMを くりかえす</span>
          </label>
          <button id="preview-stop" class="stop-all" type="button">ぜんぶ とめる</button>
        </div>

        <p id="preview-status" class="preview-status" role="status" aria-live="polite">
          ききたい おとを えらんでください
        </p>
      </header>

      <section class="preview-section" aria-labelledby="bgm-title">
        <div class="section-heading">
          <div>
            <p class="section-number">BGM・3きょく</p>
            <h2 id="bgm-title">ぼうけんの おんがく</h2>
          </div>
          <p>ゲームちゅうは くりかえして ながれます</p>
        </div>
        <div id="bgm-list" class="audio-grid audio-grid-bgm"></div>
      </section>

      <section class="preview-section" aria-labelledby="sfx-title">
        <div class="section-heading">
          <div>
            <p class="section-number">こうかおん・8しゅるい</p>
            <h2 id="sfx-title">そうさと せいかいの おと</h2>
          </div>
          <p>ボタンや けっかに あわせて みじかく なります</p>
        </div>
        <div id="sfx-list" class="audio-grid audio-grid-sfx"></div>
      </section>

      <footer class="preview-footer">
        <a href="./">ゲームへ もどる</a>
        <p>すべて このゲームのために つくった オリジナルおんげんです。</p>
      </footer>
    </main>
    <script type="module" src="/src/audio-preview.ts"></script>
  </body>
</html>
